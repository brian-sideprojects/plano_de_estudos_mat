<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha de Matemática</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1c1b19; --sub:#6b6862;
  --accent:#b5482b; --accent2:#2f6b4f; --border:#e6e3dc; --track:#ece9e2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --card:#211f1c; --text:#eeece7; --sub:#a19c92;
    --accent:#e2724a; --accent2:#5fb98a; --border:#37342e; --track:#2c2a26;
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --card:#211f1c; --text:#eeece7; --sub:#a19c92;
  --accent:#e2724a; --accent2:#5fb98a; --border:#37342e; --track:#2c2a26;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:820px; margin:0 auto; padding:28px 18px 60px;}
h1{font-size:1.5rem; margin:0 0 4px;}
.sub{color:var(--sub); font-size:.9rem; margin:0 0 20px;}
.overall{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:16px 18px; margin-bottom:22px; position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 8px); z-index:5;
}
.overall-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.overall-top strong{font-size:1.1rem;}
.bar{height:9px; background:var(--track); border-radius:6px; overflow:hidden;}
.bar > div{height:100%; background:var(--accent2); border-radius:6px; transition:width .3s;}
.cat{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  margin-bottom:14px; overflow:hidden;
}
.cat-head{
  display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none;
}
.cat-head:hover{background:var(--track);}
.cat-num{
  width:26px; height:26px; border-radius:50%; background:var(--accent);
  color:#fff; font-size:.8rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.cat-title{flex:1; font-weight:600; font-size:.98rem;}
.cat-progress{font-size:.8rem; color:var(--sub); white-space:nowrap;}
.chev{transition:transform .2s; color:var(--sub); flex-shrink:0;}
.cat.open .chev{transform:rotate(90deg);}
.cat-mini-bar{height:5px; background:var(--track);}
.cat-mini-bar > div{height:100%; background:var(--accent);}
.cat-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.topics{list-style:none; margin:0; padding:6px 16px 14px;}
.topics li{
  display:flex; align-items:center; gap:10px; padding:7px 4px; border-bottom:1px dashed var(--border); font-size:.92rem;
}
.topics li:last-child{border-bottom:none;}
.topics input{width:20px; height:20px; accent-color:var(--accent2); flex-shrink:0; cursor:pointer;}
.topics label{cursor:pointer; flex:1; line-height:1.4;}
.topics li.done label{color:var(--sub); text-decoration:line-through;}
.reset{
  margin-top:24px; font-size:.82rem; color:var(--sub); background:none; border:1px solid var(--border);
  padding:8px 14px; border-radius:8px; cursor:pointer;
}
.reset:hover{border-color:var(--accent);}

@media (max-width:480px){
  .wrap{padding:18px 12px 50px;}
  h1{font-size:1.25rem;}
  .cat-head{padding:12px; gap:8px;}
  .cat-num{width:22px; height:22px; font-size:.72rem;}
  .cat-title{font-size:.88rem;}
  .cat-progress{font-size:.72rem;}
  .topics{padding:4px 12px 12px;}
  .topics li{font-size:.88rem; padding:9px 2px;}
  .overall{padding:12px 14px;}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trilha de Matemática</h1>
  <p class="sub">Toque em um bloco para expandir e marque os tópicos já dominados.</p>

  <div class="overall">
    <div class="overall-top"><strong id="overallPct">0%</strong><span class="sub" id="overallCount">0/0</span></div>
    <div class="bar"><div id="overallBar" style="width:0%"></div></div>
  </div>

  <div id="cats"></div>
  <button class="reset" onclick="resetAll()">Zerar progresso</button>
</div>

<script>
const DATA = [
["Números e Aritmética","Números naturais, inteiros, racionais, irracionais e reais;Sistema decimal;Adição, subtração, multiplicação e divisão;Tabuada;Frações;Decimais;Números negativos;Expressões numéricas e ordem das operações;Módulo;Comparação e ordenação;Múltiplos e divisores;Números primos e fatoração;Critérios de divisibilidade;MMC e MDC;Potenciação;Radiciação;Notação científica;Aproximação, arredondamento, estimativa e cálculo mental"],
["Álgebra e Funções","Padrões e sequências;Igualdade e equivalência;Incógnitas e variáveis;Expressões algébricas e valor numérico;Monômios e polinômios;Propriedade distributiva;Produtos notáveis;Fatoração algébrica;Equações do 1º grau;Inequações;Sistemas de equações;Equações do 2º grau e relações entre raízes;Função e suas representações;Domínio e imagem;Função afim;Função quadrática;Funções polinomiais e racionais;PA e PG;Função exponencial;Logaritmos e função logarítmica"],
["Geometria e Trigonometria","Ponto, reta e plano;Posições de retas;Ângulos;Triângulos;Quadriláteros;Polígonos;Circunferência e círculo;Simetria;Congruência;Semelhança;Teorema de Tales;Teorema de Pitágoras;Relações métricas;Perímetro e áreas;Sólidos geométricos;Prismas, pirâmides, cilindros, cones e esferas;Planificações;Volume;Plano cartesiano;Distância entre pontos e ponto médio;Equação da reta e da circunferência;Paralelismo e perpendicularidade;Seno, cosseno e tangente;Resolução de triângulos"],
["Grandezas, Medidas e Unidades","Comprimento;Área;Volume;Capacidade;Massa;Tempo;Temperatura;Ângulo;Unidades métricas e conversões;Unidades quadradas e cúbicas;Medidas agrárias;Sistema monetário;Velocidade;Densidade;Consumo e vazão;Escalas;Proporcionalidade entre medidas;Precisão, aproximação e escolha de unidades"],
["Razão, Proporcionalidade e Variação","Razão e proporção;Grandezas diretamente proporcionais;Grandezas inversamente proporcionais;Regra de três simples e composta;Divisão proporcional;Taxas;Porcentagem;Variações percentuais;Escalas;Velocidade média;Densidade;Produtividade;Consumo;Relações entre grandezas;Taxas de variação"],
["Estatística, Probabilidade e Combinatória","Coleta e organização de dados;População e amostra;Tipos de dados;Tabelas e gráficos;Frequência absoluta e relativa;Média e média ponderada;Mediana;Moda;Amplitude;Variância;Desvio padrão;Interpretação crítica de gráficos;Acaso e eventos certos, possíveis e impossíveis;Espaço amostral;Probabilidade;Eventos complementares;Eventos independentes;Probabilidade condicional;Princípio aditivo e multiplicativo da contagem;Fatorial;Permutações, arranjos e combinações"],
["Matemática Financeira","Porcentagem aplicada;Aumentos e descontos;Percentuais sucessivos;Preço à vista e a prazo;Taxas;Juros, capital e montante;Juros simples;Juros compostos;Parcelamento;Inflação e poder de compra;Rendimento;Comparação de propostas;Empréstimos;Cartão de crédito;Planejamento financeiro"],
["Raciocínio Matemático, Modelagem e Resolução de Problemas","Interpretação de enunciados;Identificar dados importantes;Descartar informação irrelevante;Transformar texto em expressão, equação, tabela, gráfico ou desenho;Escolher uma estratégia;Estimar antes de calcular;Testar hipóteses;Reconhecer padrões;Generalizar;Justificar respostas;Comparar métodos;Verificar resultados;Argumentar matematicamente;Interpretar o resultado no contexto original;Usar calculadora e outras ferramentas conscientemente"]
];

let state = {};
try{ state = JSON.parse(localStorage.getItem('math-trail-state')||'{}'); }catch(e){ state = {}; }

function save(){
  try{ localStorage.setItem('math-trail-state', JSON.stringify(state)); }catch(e){}
}

function render(){
  const cats = document.getElementById('cats');
  cats.innerHTML = '';
  let totalAll=0, doneAll=0;

  DATA.forEach((cat,ci)=>{
    const [title, raw] = cat;
    const topics = raw.split(';');
    totalAll += topics.length;
    const doneCount = topics.filter((_,ti)=>state[ci+'-'+ti]).length;
    doneAll += doneCount;
    const pct = Math.round((doneCount/topics.length)*100);

    const div = document.createElement('div');
    div.className = 'cat';
    div.innerHTML = `
      <div class="cat-head" onclick="toggle(${ci})">
        <div class="cat-num">${ci+1}</div>
        <div class="cat-title">${title}</div>
        <div class="cat-progress">${doneCount}/${topics.length}</div>
        <div class="chev">▶</div>
      </div>
      <div class="cat-mini-bar"><div style="width:${pct}%"></div></div>
      <div class="cat-body" id="body-${ci}">
        <ul class="topics">
          ${topics.map((t,ti)=>`
            <li class="${state[ci+'-'+ti]?'done':''}">
              <input type="checkbox" id="chk-${ci}-${ti}" ${state[ci+'-'+ti]?'checked':''} onchange="mark(${ci},${ti},this.checked)">
              <label for="chk-${ci}-${ti}">${t}</label>
            </li>`).join('')}
        </ul>
      </div>`;
    cats.appendChild(div);
  });

  document.getElementById('overallPct').textContent = totalAll?Math.round((doneAll/totalAll)*100)+'%':'0%';
  document.getElementById('overallCount').textContent = doneAll+'/'+totalAll;
  document.getElementById('overallBar').style.width = (totalAll?(doneAll/totalAll)*100:0)+'%';
}

function toggle(ci){
  const div = document.querySelectorAll('.cat')[ci];
  const body = document.getElementById('body-'+ci);
  const isOpen = div.classList.contains('open');
  document.querySelectorAll('.cat').forEach((c,i)=>{
    c.classList.remove('open');
    document.getElementById('body-'+i).style.maxHeight = null;
  });
  if(!isOpen){
    div.classList.add('open');
    body.style.maxHeight = body.scrollHeight+'px';
  }
}

function mark(ci,ti,val){
  state[ci+'-'+ti] = val;
  save();
  render();
  // reopen the category just edited
  setTimeout(()=>{
    document.querySelectorAll('.cat')[ci].classList.add('open');
    const body = document.getElementById('body-'+ci);
    body.style.maxHeight = body.scrollHeight+'px';
  },0);
}

function resetAll(){
  if(confirm('Zerar todo o progresso?')){
    state = {};
    save();
    render();
  }
}

render();
</script>
</body>
</html>
